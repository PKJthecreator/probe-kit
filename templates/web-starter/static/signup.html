<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입</title>
<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="brand.css">
</head>
<body>
<main class="auth card">
  <div id="brand"></div>
  <h1>회원가입</h1>
  <div id="msg" role="alert"></div>
  <form id="f" method="post" action="javascript:void 0" novalidate>
    <div class="field"><label for="username">아이디</label>
      <div class="row"><input id="username" name="username" autocomplete="username" required maxlength="40" style="flex:1">
        <button class="btn" type="button" id="check">중복 확인</button></div>
      <div class="hint" id="username-hint"></div><div class="error" id="username-error"></div></div>
    <div class="field"><label for="name">이름</label>
      <input id="name" name="name" autocomplete="name" required maxlength="30"><div class="error" id="name-error"></div></div>
    <div class="field"><label for="email">이메일 <span class="hint">(비밀번호 찾기에 씁니다)</span></label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="120"><div class="error" id="email-error"></div></div>
    <div class="field"><label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required maxlength="129" aria-describedby="pw-rules">
      <ul class="pw-list" id="pw-rules"></ul><div class="error" id="password-error"></div></div>
    <div class="field"><label for="confirm">비밀번호 확인</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required><div class="error" id="confirm-error"></div></div>
    <button class="btn primary">가입하기</button>
  </form>
  <div class="links"><a href="login.html">로그인으로</a></div>
</main>
<script type="module">
import { api } from "./api.js";
import { $, wordmark, fieldErrors, busy, passwordChecklist } from "./ui.js";
$("#brand").append(wordmark());
const f = $("#f"), msg = $("#msg");
const policy = await passwordChecklist(f.password, $("#pw-rules"), f.username);
$("#username-hint").textContent = policy.username_hint;

$("#check").onclick = async () => {
  const r = await api("/api/auth/check-username?username=" + encodeURIComponent(f.username.value.trim()));
  fieldErrors(f, r.available ? {} : { username: r.reasons });
  if (r.available) $("#username-hint").textContent = "✓ 쓸 수 있는 아이디";
};

f.onsubmit = (e) => {
  e.preventDefault();
  msg.textContent = ""; msg.className = "";
  const errs = {};
  if (!new RegExp(policy.username_pattern).test(f.username.value.trim().toLowerCase())) errs.username = [policy.username_hint];
  if (!f.name.value.trim()) errs.name = ["이름을 입력하세요"];
  if (f.email.value && !f.email.checkValidity()) errs.email = ["이메일 형식을 확인하세요"];
  if ([...$("#pw-rules").children].some((li) => !li.classList.contains("ok"))) errs.password = ["비밀번호 규칙을 모두 만족해야 합니다"];
  if (f.password.value !== f.confirm.value) errs.confirm = ["비밀번호가 서로 다릅니다"];
  fieldErrors(f, errs);
  if (Object.keys(errs).length) return f.querySelector('[aria-invalid="true"]').focus();
  busy(f.querySelector("button.primary"), async () => {
    try {
      await api("/api/auth/signup", { method: "POST", body: { username: f.username.value, name: f.name.value, email: f.email.value, password: f.password.value } });
      location.href = "app.html"; // 가입하면 바로 로그인된다(구성원 역할)
    } catch (err) {
      fieldErrors(f, err.status === 409 ? { username: [err.message] } : err.fields);
      msg.className = "alert ng"; msg.textContent = err.message;
    }
  });
};
</script>
</body>
</html>
