<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 찾기</title>
<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="brand.css">
</head>
<body>
<main class="auth card">
  <div id="brand"></div>
  <h1>비밀번호 찾기</h1>
  <p>가입할 때 적은 아이디와 이메일을 넣으면 재설정 링크를 보냅니다. 메일 서버가 없는 환경에서는 운영자에게 요청하세요(운영자가 임시 비밀번호를 발급합니다).</p>
  <div id="msg" role="status"></div>
  <form id="f" method="post" action="javascript:void 0" novalidate>
    <div class="field"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required maxlength="40"></div>
    <div class="field"><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="120"></div>
    <button class="btn primary">재설정 링크 받기</button>
  </form>
  <div class="links"><a href="login.html">로그인으로</a></div>
</main>
<script type="module">
import { api } from "./api.js";
import { $, wordmark, busy } from "./ui.js";
$("#brand").append(wordmark());
const f = $("#f"), msg = $("#msg");
f.onsubmit = (e) => {
  e.preventDefault();
  if (!f.username.value.trim() || !f.email.value.trim()) { msg.className = "alert ng"; msg.textContent = "아이디와 이메일을 모두 넣으세요."; return; }
  busy(f.querySelector("button"), async () => {
    try {
      const r = await api("/api/auth/forgot", { method: "POST", body: { username: f.username.value, email: f.email.value } });
      msg.className = "alert ok"; msg.textContent = r.message; // 있는 아이디든 없든 같은 문구(가입 여부를 알려 주지 않는다)
    } catch (err) { msg.className = "alert ng"; msg.textContent = err.message; }
  });
};
</script>
</body>
</html>
