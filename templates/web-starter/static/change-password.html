<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 변경</title>
<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="brand.css">
</head>
<body>
<main class="auth card">
  <div id="brand"></div>
  <h1>비밀번호 변경</h1>
  <p id="why" class="hint"></p>
  <div id="msg" role="alert"></div>
  <form id="f" method="post" action="javascript:void 0" novalidate>
    <div class="field"><label for="current">현재(임시) 비밀번호</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required><div class="error" id="current-error"></div></div>
    <div class="field"><label for="new">새 비밀번호</label>
      <input id="new" name="new" type="password" autocomplete="new-password" required maxlength="129">
      <ul class="pw-list" id="pw-rules"></ul><div class="error" id="new-error"></div></div>
    <div class="field"><label for="confirm">새 비밀번호 확인</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required><div class="error" id="confirm-error"></div></div>
    <button class="btn primary">바꾸기</button>
  </form>
</main>
<script type="module">
import { api } from "./api.js";
import { $, guard, wordmark, fieldErrors, busy, passwordChecklist } from "./ui.js";
$("#brand").append(wordmark());
const me = await guard();
if (me.must_change) $("#why").textContent = "임시 비밀번호로 로그인했습니다. 계속하려면 비밀번호를 바꾸세요.";
const f = $("#f"), msg = $("#msg");
const who = { value: me.username }; // 아이디 포함 금지 규칙용
await passwordChecklist(f.new, $("#pw-rules"), who);
f.onsubmit = (e) => {
  e.preventDefault();
  const errs = f.new.value !== f.confirm.value ? { confirm: ["비밀번호가 서로 다릅니다"] } : {};
  fieldErrors(f, errs);
  if (errs.confirm) return;
  busy(f.querySelector("button"), async () => {
    try {
      await api("/api/auth/password", { method: "POST", body: { current: f.current.value, new: f.new.value } });
      location.href = me.role === "admin" ? "admin.html" : "app.html";
    } catch (err) { fieldErrors(f, err.fields); msg.className = "alert ng"; msg.textContent = err.message; }
  });
};
</script>
</body>
</html>
