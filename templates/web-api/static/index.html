<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설비 판정</title>
<style>
  :root { --ok:#1a7f37; --warn:#9a6700; --ng:#cf222e; font-family: system-ui, sans-serif; }
  body { max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  form { display: grid; gap: .75rem; }
  label { display: grid; gap: .25rem; font-weight: 600; }
  input, button { font: inherit; padding: .5rem; }
  button[disabled] { opacity: .6; }
  #result { margin-top: 1rem; padding: .75rem; border-radius: 6px; border: 1px solid #d0d7de; }
  .OK { color: var(--ok); } .WARN { color: var(--warn); } .NG { color: var(--ng); }
  .error { color: var(--ng); }
</style>
</head>
<body>
<h1>설비 판정</h1>
<form id="f">
  <label>설비 ID <input name="equipment_id" required maxlength="50" value="EQ-001"></label>
  <label>온도(℃) <input name="temperature" type="number" step="any" required min="-50" max="500"></label>
  <label>압력(bar) <input name="pressure" type="number" step="any" required min="0" max="100"></label>
  <button>판정</button>
</form>
<div id="result" role="status" aria-live="polite">값을 넣고 판정을 누르세요.</div>
<script>
const f = document.getElementById("f"), out = document.getElementById("result");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = f.querySelector("button");
  const body = Object.fromEntries(new FormData(f));
  body.temperature = Number(body.temperature); body.pressure = Number(body.pressure);
  btn.disabled = true; out.textContent = "판정 중…";
  try {
    const r = await fetch("/api/judgements", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(r.status === 422 ? "입력값을 확인하세요: " + data.detail.map(d => d.loc.at(-1)).join(", ") : (data.detail || r.status));
    out.innerHTML = "";
    const s = document.createElement("strong"); s.className = data.status; s.textContent = data.status;
    out.append(s, ` (규칙 ${data.rule_version}) `, data.reasons.join(" / ") || "이상 없음");
  } catch (err) {
    out.innerHTML = ""; const p = document.createElement("span"); p.className = "error"; p.textContent = "오류: " + err.message; out.append(p);
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
